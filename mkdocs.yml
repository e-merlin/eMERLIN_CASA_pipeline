site_name: e-MERLIN CASA pipeline
site_description: 'CASA eMERLIN pipeline to calibrate data from the e-MERLIN array'
site_author: 'Javier Moldon'
repo_url: 'https://github.com/e-merlin/eMERLIN_CASA_pipeline'
site_url: 'https://e-merlin.github.io/eMERLIN_CASA_pipeline/'

# Repository
repo_name: 'e-merlin/eMERLIN_CASA_pipeline'
edit_uri: 'edit/development/docs/'

nav:
    - Home: index.md
    - Pipeline description: src/description.md
    - Installation: src/installation.md
    - Container design notes: src/container_design.md
    - Usage: src/usage.md
    - Configuration: src/configuration.md
    - Pipeline Steps: src/pipeline_steps.md
    - Customizing the Pipeline: src/customization.md
    - Examples: src/examples.md
    - Troubleshooting: src/troubleshooting.md
    - API: src/api.md
    - Acknowledgements: src/acknowledgements.md

theme:
    name: material
    palette:
        primary: indigo
        accent: indigo
    features:
        - navigation.instant
        - navigation.tracking
        - navigation.expand
        - navigation.indexes
        - search.highlight
        - search.share
    icon:
        repo: fontawesome/brands/github

markdown_extensions:
  - toc:
      permalink: True
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
