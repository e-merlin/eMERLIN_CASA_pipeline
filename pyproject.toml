[build-system]
requires = ["setuptools>=62.6.0", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eMCP"
authors = [
    {name = "Javier Moldon", email = "jmoldon@iaa.es"},
]
maintainers = [
    {name = "Javier Moldon", email = "jmoldon@iaa.es"},
]
description = "CASA eMERLIN pipeline to calibrate data from the e-MERLIN array."
readme = "README.md"
license = {text = "GNU GPL"}
requires-python = ">=3.10, <3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy"
]
dependencies = [
    "casaconfig==1.0.2",
    "casatools==6.7.0.31",
    "casatasks==6.7.0.31",
    "casaplotms==2.6.2",
    "casaviewer==2.3.2",
    "casashell==6.7.0.31",
    "casaplotserver==1.9.2",
    "casatestutils==6.7.0.31",
    "casatablebrowser==0.0.37",
    "casalogger==1.0.21",
    "casafeather==0.0.24",
    "casampi==0.5.6",
    "aplpy==2.1.0",
    "astropy==5.1.1",
    "astroquery==0.4.6",
    "cmasher==1.6.3",
    "ipython==8.6.0",
    "matplotlib==3.6.1",
    "python-casacore==3.5.2",
    "protobuf==3.20",
    "scipy==1.9.3",
]
dynamic = ["version"]

[project.urls]
Source = "https://github.com/e-merlin/eMERLIN_CASA_pipeline"
Documentation = "https://github.com/e-merlin/eMERLIN_CASA_pipeline/tree/master/docs"
Issues = "https://github.com/e-merlin/eMERLIN_CASA_pipeline/issues"

[project.scripts]
emcp = "eMCP.cli:main"

[tool.setuptools.package-data]
"eMCP.aoflagger_strategies.default" = ["*.lua", "*.rfis"]
"eMCP.aoflagger_strategies.other" = ["*.lua", "*.rfis"]
"eMCP.calibrator_models" = ["*.dat", "*.f0", "*.f0_TSM0", "*.lock", "*.info"]
"eMCP.utils" = ["*.css", "*.gif", "*.png"]
"eMCP" = ["default_params.yaml", "inputs.ini"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["eMCP*"]
namespaces = false

[tool.setuptools_scm]
write_to = "src/eMCP/_version.py"
