[build-system]
requires = ["setuptools>=75.0,<81", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eMCP"
authors = [
    {name = "Javier Moldon", email = "jmoldon@iaa.es"},
]
maintainers = [
    {name = "Javier Moldon", email = "jmoldon@iaa.es"},
]
description = "CASA eMERLIN pipeline to calibrate data from the e-MERLIN array."
readme = "README.md"
license = {text = "GNU GPL"}
requires-python = ">=3.8,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy"
]
dependencies = [
    # Core system dependencies (versions matching environment.yaml)
    "numpy",
    "aplpy",
    "astropy",
    "astroquery",
    "cmasher",
    "ipython",
    "matplotlib",
    "scipy",
    "reproject",
    "pyregion",
    "protobuf==3.20",

    # CASA tools
    # Core CASA packages - versions tied to main CASA version
    "casatools>=6.6.0,<6.8.0",
    "casatasks>=6.6.0,<6.8.0",
    "casashell>=6.6.0,<6.8.0",
    "casatestutils>=6.6.0,<6.8.0",

    # Configuration - follows CASA major releases
    "casaconfig>=1.2.0,<1.5.0",
    
    "shadems>=0.5.4,<0.6.0",
    "dask[dataframe]>=2023.1.1,<2024.0.0", # shadeMS 0.5.4 uses the pre-dask-expr DataFrame constructor

    # Utility packages - incremental versioning
    "casatablebrowser>=0.0.33,<1.0.0", # 6.6.0→0.0.33, 6.6.4+→0.0.35, 6.7.0→0.0.37
    "casalogger>=1.0.17,<2.0.0",       # 6.6.0→1.0.17, 6.6.4+→1.0.19, 6.7.0→1.0.21
    "casampi>=0.5.4,<1.0.0",           # 6.6.0→0.5.4, 6.6.4+→0.5.5, 6.7.0→0.5.6

]

dynamic = ["version"]

[project.optional-dependencies]
casa-data = [
    "casadata>=2023.9.25",
]

[project.urls]
Source = "https://github.com/e-merlin/eMERLIN_CASA_pipeline"
Documentation = "https://github.com/e-merlin/eMERLIN_CASA_pipeline/tree/master/docs"
Issues = "https://github.com/e-merlin/eMERLIN_CASA_pipeline/issues"

[project.scripts]
emcp = "eMCP.cli:main"

[tool.setuptools.package-data]
"eMCP.aoflagger_strategies.default" = ["*.lua", "*.rfis"]
"eMCP.aoflagger_strategies.other" = ["*.lua", "*.rfis"]
"eMCP.calibrator_models" = ["*.dat", "*.f0", "*.f0_TSM0", "*.lock", "*.info"]
"eMCP.utils" = ["*.css", "*.gif", "*.png"]
"eMCP" = ["default_params.yaml", "inputs.ini"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["eMCP*"]
namespaces = false

[tool.setuptools_scm]
write_to = "src/eMCP/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
